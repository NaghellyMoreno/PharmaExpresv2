        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    consentCookie:
      type: apiKey
      in: cookie
      name: __Host-pe_consent
      description: Cookie firmada con la aceptación del aviso de privacidad. No se guarda en base de datos.
    deviceSession:
      type: apiKey
      in: cookie
      name: __Host-pe_device
      description: Navegador del paciente. Acceso a /patients/{patientRefId} solo con vinculación vigente a ese paciente. Mutaciones con X-CSRF-Token.
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-pe_staff
      description: |
        Sesión del personal. El rol requerido es explícito por ruta: /dispenser/* solo dispensador (y su punto); /admin/* solo administrador;
        /staff/sessions/current cualquier rol del personal. Mutaciones con X-CSRF-Token. Máximo 12 h; inactividad 30 min (dispensador) o 15 min (administrador).
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
    jobBearer:
      type: http
      scheme: bearer
      description: CRON_SECRET.
    schedulerSignature:
      type: apiKey
      in: header
      name: Upstash-Signature
      description: Firma del disparador externo si la usuaria escoge QStash (ADR 0011).

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    PatientRefId:
      name: patientRefId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FormulaId:
      name: formulaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PointId:
      name: pointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WindowId:
      name: windowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MedicationId:
      name: medicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DispenserId:
      name: dispenserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Eps:
      name: eps
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Eps' }

  responses:
    BadRequest:
      description: Entrada inválida (validation_failed).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Sin sesión, sesión vencida, secreto o firma incorrectos, o credenciales inválidas.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rol no permitido, recurso de otro punto, sin vinculación vigente o sin autorización de datos de salud.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso inexistente o ajeno.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto de negocio (por ejemplo, open_requests_limit, attempts_exhausted, already_cancelled).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConfigurationConflict:
      description: El ajuste dejaría capacidad o existencias por debajo de lo reservado, o afectaría ventanas con citas activas. Ninguna cita se cancela.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ConfigurationConflictProblem' }
    Gone:
      description: Recurso vencido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CodeGone:
      description: Código vencido, anulado por uno nuevo o con intentos agotados (code_expired, code_superseded, code_attempts_exhausted). Incluye los tres caminos de salida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WrongCode:
      description: Código incorrecto (code_incorrect); incluye intentos restantes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkGone:
      description: Enlace usado, anulado o vencido (link_invalid).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Archivo de más de 10 MB (file_too_large).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Tipo no aceptado por su contenido real (file_type_not_allowed). Formatos aceptados JPG, PNG, HEIC y PDF.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Regla de negocio no cumplida (por ejemplo, pdf_too_many_pages, documents_missing, formula_not_eligible, window_not_allowed, password_policy).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Límite de frecuencia (code_too_soon, code_hourly_limit, uploads_hourly_limit, login_rate_limited).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: Formato único de error (RFC 9457). Nunca incluye cédulas, diagnósticos ni datos de la petición.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: ['https://pharma-express.example/errors/code_incorrect'] }
        title: { type: string, examples: ['El código no es correcto'] }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Código estable en inglés., examples: [code_incorrect] }
        instance: { type: string }
        correlationId: { type: string }
        retryAfterSeconds: { type: integer, minimum: 0 }
        attemptsRemaining: { type: integer, minimum: 0, maximum: 3 }
        nextSteps:
          type: array
          items: { $ref: '#/components/schemas/NextStep' }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    NextStep:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [request_new_code, update_data_at_eps, in_person_service, contact_eps, wait_48_hours, start_new_request] }
        label: { type: string, examples: ['Pedir un código nuevo'] }
    ConfigurationConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            minimumAllowed: { type: integer, minimum: 0, description: Capacidad o existencias mínimas posibles. }
            windowsWithActiveAppointments:
              type: array
              items:
                type: object
                required: [windowId, startTime]
                properties:
                  windowId: { type: string, format: uuid }
                  startTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                  activeAppointments: { type: integer, minimum: 1 }
    ReservationConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [updatedOptions]
          properties:
            updatedOptions: { $ref: '#/components/schemas/AvailabilityResult' }

    Eps:
      type: string
      enum: [salud_total, sanitas]
    Channel:
      type: string
      enum: [web, telegram]
    Declarant:
      type: string
      enum: [holder, third_party]
      description: "holder: soy el titular; third_party: actúo con su autorización."
    GenericMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }

    PrivacyNotice:
      type: object
      required: [version, title, body, declaration, revocationOption]
      properties:
        version: { type: string, examples: ['2026-10-v1'] }
        title: { type: string }
        body: { type: string }
        declaration: { type: string, examples: ['Soy el titular o actúo con su autorización'] }
        revocationOption:
          type: object
          required: [label, cedulaUseNotice]
          properties:
            label: { type: string, const: 'Revocar mi autorización' }
            cedulaUseNotice: { type: string, description: Informa que la cédula se usa solo para verificar la identidad y atender la solicitud. }
    ConsentAcceptanceInput:
      type: object
      required: [noticeVersion, declarant]
      additionalProperties: false
      properties:
        noticeVersion: { type: string, maxLength: 32 }
        declarant: { $ref: '#/components/schemas/Declarant' }
    CedulaInput:
      type: object
      required: [cedula]
      additionalProperties: false
      properties:
        cedula: { type: string, pattern: '^[0-9]{5,12}$', examples: ['1000000001'] }
    OtpRequestAccepted:
      type: object
      required: [challengeId, message, resendAvailableInSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        message:
          type: string
          const: 'Si la cédula está afiliada a Salud Total o Sanitas, enviamos un código al celular registrado en tu EPS y al correo, si lo tiene. Si no te llega en 2 minutos, puedes pedir un código nuevo, actualizar tus datos en tu EPS o acudir a la atención presencial.'
        resendAvailableInSeconds: { type: integer, const: 120 }
    OtpVerificationInput:
      type: object
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{4,10}$', description: Longitud definitiva Pendiente (ADR 0006). }
    VerificationResult:
      type: object
      required: [binding, csrfToken]
      properties:
        binding: { $ref: '#/components/schemas/Binding' }
        csrfToken: { type: string }
    RevocationResult:
      type: object
      required: [cancelledActiveAppointments, message]
      properties:
        cancelledActiveAppointments: { type: integer, minimum: 0 }
        message: { type: string, examples: ['Revocaste tu autorización. Eliminamos tus datos y cancelamos tus 2 citas activas.'] }

    Binding:
      type: object
      required: [patientRefId, displayName, expiresAt, hasHealthDataAuthorization]
      properties:
        patientRefId: { type: string, format: uuid }
        displayName: { type: string, description: Nombre del paciente según la EPS simulada (P13)., examples: ['Paciente Ficticio Uno'] }
        expiresAt: { type: string, format: date-time }
        hasHealthDataAuthorization: { type: boolean }
    ChannelSession:
      type: object
      required: [bindings, csrfToken, pushEnabled]
      properties:
        bindings:
          type: array
          items: { $ref: '#/components/schemas/Binding' }
        csrfToken: { type: string }
        pushEnabled: { type: boolean }
        vapidPublicKey: { type: string }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          additionalProperties: false
          properties:
            p256dh: { type: string, maxLength: 256 }
            auth: { type: string, maxLength: 64 }
    HealthDataAuthorizationInput:
      type: object
      required: [noticeVersion, declarant]
      additionalProperties: false
      properties:
        noticeVersion: { type: string, maxLength: 32 }
        declarant: { $ref: '#/components/schemas/Declarant' }

    RequestStatus:
      type: string
      enum: [open, closed]
    FormulaStatus:
      type: string
      enum: [loading, prevalidating, eligible, not_eligible, scheduled, delivered, partially_delivered_closed, cancelled, lost]
    CareRequestSummary:
      type: object
      required: [requestId, status, createdAt, formulaCount]
      properties:
        requestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RequestStatus' }
        createdAt: { type: string, format: date-time }
        formulaCount: { type: integer, minimum: 0 }
    CareRequestDetail:
      type: object
      required: [requestId, status, processing, clinicalHistory, formulas, preliminaryNotice]
      properties:
        requestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RequestStatus' }
        processing:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [idle, processing, done] }
            message: { type: string, examples: ['Procesando'] }
        affiliation:
          type: object
          properties:
            result: { type: string, enum: [active, inactive, not_checked] }
            guidance: { type: string }
        clinicalHistory: { $ref: '#/components/schemas/DocumentSlot' }
        formulas:
          type: array
          items: { $ref: '#/components/schemas/FormulaView' }
        preliminaryNotice:
          type: string
          const: 'Este resultado es preliminar. La validación oficial ocurre en el punto de dispensación.'
    DocumentSlot:
      type: object
      required: [uploadsUsed, uploadsAllowed, status]
      properties:
        documentId: { type: [string, 'null'], format: uuid }
        uploadsUsed: { type: integer, minimum: 0, maximum: 3 }
        uploadsAllowed: { type: integer, const: 3 }
        status: { type: string, enum: [empty, pending_upload, validating, ocr_pending, accepted, needs_reupload, failed_final] }
        reason: { type: string, enum: [illegible, incomplete, missing_diagnosis, no_match_with_eps, invalid_file] }
    DocumentStatus:
      type: object
      required: [documentId, status]
      properties:
        documentId: { type: string, format: uuid }
        status: { type: string, enum: [validating, ocr_pending, accepted, needs_reupload, failed_final] }
    FormulaView:
      type: object
      required: [formulaId, status, document]
      properties:
        formulaId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/FormulaStatus' }
        treatment: { type: [string, 'null'], enum: [acute, chronic, null] }
        document: { $ref: '#/components/schemas/DocumentSlot' }
        prevalidation: { $ref: '#/components/schemas/PrevalidationResult' }
        medications:
          type: array
          description: Solo con vinculación vigente. Nunca se incluye el diagnóstico.
          items:
            type: object
            required: [medicationId, name, quantity]
            properties:
              medicationId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
    PrevalidationResult:
      type: object
      required: [outcome, preliminary, steps, evaluatedAt]
      properties:
        outcome: { type: string, enum: [eligible, not_eligible] }
        preliminary: { type: boolean, const: true }
        evaluatedAt: { type: string, format: date-time }
        steps:
          type: array
          description: Orden fijo afiliación, vigencia, cobertura PBS, autorización y habilitación (solo crónicas).
          items:
            type: object
            required: [rule, result]
            properties:
              rule: { type: string, enum: [affiliation, validity, pbs_coverage, authorization, delivery_enabled] }
              result: { type: string, enum: [passed, failed, not_evaluated] }
              guidance: { type: string }
        authorizationGuides:
          type: array
          description: Puntos, enlaces o trámites de la EPS del paciente cuando falta autorización. El sistema no tramita.
          items: { $ref: '#/components/schemas/AuthorizationGuide' }
    UploadIntentInput:
      type: object
      required: [kind, declaredContentType, sizeBytes]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [formula, clinical_history] }
        formulaId: { type: string, format: uuid, description: Para recargar una fórmula existente; omitir para una fórmula nueva. }
        declaredContentType: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    UploadIntent:
      type: object
      required: [documentId, uploadUrl, expiresAt, maxSizeBytes, uploadsRemaining]
      properties:
        documentId: { type: string, format: uuid }
        formulaId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri, description: URL firmada de Vercel Blob privado para PUT directo. }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer, const: 10485760 }
        uploadsRemaining: { type: integer, minimum: 0, maximum: 2 }

    Point:
      type: object
      required: [pointId, name, active, schedule]
      properties:
        pointId: { type: string, format: uuid }
        name: { type: string, examples: ['Punto Ficticio Centro'] }
        active: { type: boolean }
        schedule:
          type: array
          items: { $ref: '#/components/schemas/ScheduleDay' }
    ScheduleDay:
      type: object
      required: [weekday, opensAt, closesAt]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: 1 = lunes. }
        opensAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        closesAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
    PointInput:
      type: object
      required: [name, schedule]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        schedule:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/ScheduleDay' }
    PointPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        schedule:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/ScheduleDay' }
    Window:
      type: object
      required: [windowId, pointId, startTime, endTime, capacity, reservedToday, reservedTomorrow, hasActiveAppointments]
      properties:
        windowId: { type: string, format: uuid }
        pointId: { type: string, format: uuid }
        startTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        endTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: startTime + 1 hora. }
        capacity: { type: integer, minimum: 0, description: Medida en citas (P7). }
        reservedToday: { type: integer, minimum: 0 }
        reservedTomorrow: { type: integer, minimum: 0 }
        hasActiveAppointments: { type: boolean }
    WindowInput:
      type: object
      required: [startTime, capacity]
      additionalProperties: false
      properties:
        startTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        capacity: { type: integer, minimum: 0, maximum: 1000 }
    Medication:
      type: object
      required: [medicationId, code, name, pbsCovered]
      properties:
        medicationId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        pbsCovered: { type: boolean }
    InventoryItem:
      type: object
      required: [pointId, medicationId, medicationName, onHand, reserved]
      properties:
        pointId: { type: string, format: uuid }
        medicationId: { type: string, format: uuid }
        medicationName: { type: string }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
    Diagnosis:
      type: object
      required: [code, description]
      properties:
        code: { type: string }
        description: { type: string }
    AuthorizationGuide:
      type: object
      required: [guideId, eps, kind, title]
      properties:
        guideId: { type: string, format: uuid }
        eps: { $ref: '#/components/schemas/Eps' }
        kind: { type: string, enum: [point, link, procedure] }
        title: { type: string }
        body: { type: string }
        url: { type: [string, 'null'], format: uri }
    AuthorizationGuideInput:
      type: object
      required: [kind, title]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [point, link, procedure] }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 2000 }
        url: { type: [string, 'null'], format: uri, maxLength: 2048 }

    AvailabilityResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [available, no_availability] }
        rule: { type: string, enum: [acute, chronic], description: Si la cita incluye algún crónico, aplica la regla del crónico. }
        medications:
          type: array
          items:
            type: object
            required: [lineRef, medicationId, name, quantity, points]
            properties:
              lineRef: { type: string, description: Identificador del medicamento dentro de la fórmula. }
              medicationId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              points:
                type: array
                items: { type: string, format: uuid }
        points:
          type: array
          items:
            type: object
            required: [pointId, name, windows]
            properties:
              pointId: { type: string, format: uuid }
              name: { type: string }
              joinableAppointment:
                description: Cita confirmada de la misma solicitud en este punto que cumple las reglas de la fórmula; agregarse no ocupa otro cupo.
                type: [object, 'null']
                properties:
                  appointmentId: { type: string, format: uuid }
                  startsAt: { type: string, format: date-time }
                  endsAt: { type: string, format: date-time }
              windows:
                type: array
                items:
                  type: object
                  required: [windowSlotId, startsAt, endsAt]
                  properties:
                    windowSlotId: { type: string, format: uuid }
                    startsAt: { type: string, format: date-time }
                    endsAt: { type: string, format: date-time }
        waitUntil:
          type: string
          format: date-time
          description: Con no_availability, momento en que puede volver a validar (48 horas, plazo propio del producto, no cumplimiento normativo).
        message: { type: string }
    ConfirmationInput:
      type: object
      required: [allocations]
      additionalProperties: false
      properties:
        allocations:
          type: array
          minItems: 1
          description: Una entrada por punto; cada medicamento de la fórmula debe quedar en exactamente una.
          items:
            type: object
            required: [pointId, lineRefs]
            additionalProperties: false
            properties:
              pointId: { type: string, format: uuid }
              windowSlotId: { type: string, format: uuid, description: Para una cita nueva. }
              joinAppointmentId: { type: string, format: uuid, description: Para agregarse a una cita confirmada de la solicitud. }
              lineRefs:
                type: array
                minItems: 1
                items: { type: string }
            oneOf:
              - required: [windowSlotId]
              - required: [joinAppointmentId]
    AppointmentStatus:
      type: string
      enum: [active, attended, closed, cancelled, expired]
    AppointmentSummary:
      type: object
      required: [appointmentId, requestId, pointId, pointName, startsAt, endsAt, status]
      properties:
        appointmentId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        pointId: { type: string, format: uuid }
        pointName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
    PatientAppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/AppointmentSummary'
        - type: object
          required: [medications, preliminaryNotice]
          properties:
            deliveryCode:
              type: [string, 'null']
              description: Código numérico de un solo uso; el QR contiene el mismo número. Nulo si la cita no está activa.
              examples: ['48213907']
            medications:
              type: array
              items:
                type: object
                required: [name, quantity, status]
                properties:
                  name: { type: string }
                  quantity: { type: integer, minimum: 1 }
                  status: { type: string, enum: [reserved, delivered, not_delivered, released, lost] }
            preliminaryNotice: { type: string }

    DispenserAppointmentSummary:
      type: object
      required: [appointmentId, startsAt, endsAt, status]
      properties:
        appointmentId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        arrivedAt: { type: [string, 'null'], format: date-time }
    DispenserAppointmentDetail:
      type: object
      required: [appointmentId, pointId, startsAt, endsAt, status, patientDisplayName, formulas]
      properties:
        appointmentId: { type: string, format: uuid }
        pointId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        arrivedAt: { type: [string, 'null'], format: date-time }
        patientDisplayName: { type: string }
        officialValidation:
          type: [object, 'null']
          properties:
            result: { type: string, enum: [valid, invalid] }
            recordedAt: { type: string, format: date-time }
        formulas:
          type: array
          items:
            type: object
            required: [formulaId, prevalidation, lines]
            properties:
              formulaId: { type: string, format: uuid }
              prevalidation: { $ref: '#/components/schemas/PrevalidationResult' }
              lines:
                type: array
                items:
                  type: object
                  required: [lineId, medicationName, quantity, status]
                  properties:
                    lineId: { type: string, format: uuid }
                    medicationName: { type: string }
                    quantity: { type: integer, minimum: 1 }
                    status: { type: string, enum: [reserved, delivered, not_delivered, released, lost] }
                    nonDeliveryReason: { $ref: '#/components/schemas/NonDeliveryReason' }
    OfficialValidationInput:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: { type: string, enum: [valid, invalid] }
        notes: { type: string, maxLength: 500, description: No debe incluir cédulas ni diagnósticos. }
    NonDeliveryReason:
      type: string
      enum: [affiliation_inactive, formula_expired_or_invalid, authorization_not_valid, medication_not_covered, patient_data_mismatch, no_stock_despite_reservation, other]
    LineClosuresInput:
      type: object
      required: [closures]
      additionalProperties: false
      properties:
        closures:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, outcome]
            additionalProperties: false
            properties:
              lineId: { type: string, format: uuid }
              outcome: { type: string, enum: [delivered, not_delivered] }
              reason: { $ref: '#/components/schemas/NonDeliveryReason' }
              description: { type: string, maxLength: 500, description: Obligatoria si reason es other (Inferido, HU-026). }
            allOf:
              - if:
                  properties: { outcome: { const: not_delivered } }
                then:
                  required: [reason]
              - if:
                  properties: { reason: { const: other } }
                  required: [reason]
                then:
                  required: [description]

    StaffRole:
      type: string
      enum: [dispenser, admin]
    StaffLoginInput:
      type: object
      required: [email, password, panel]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
        panel: { $ref: '#/components/schemas/StaffRole' }
    StaffSession:
      type: object
      required: [userId, role, displayName, csrfToken, idleTimeoutSeconds, absoluteExpiresAt]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/StaffRole' }
        displayName: { type: string }
        pointId: { type: [string, 'null'], format: uuid }
        pointName: { type: [string, 'null'] }
        csrfToken: { type: string }
        idleTimeoutSeconds: { type: integer, enum: [900, 1800] }
        absoluteExpiresAt: { type: string, format: date-time }
    PasswordChangeInput:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        newPassword: { type: string, minLength: 1, maxLength: 256, description: Política de contraseña Pendiente (ADR 0014). }
    DispenserAccount:
      type: object
      required: [dispenserId, email, displayName, pointId, active, passwordStatus]
      properties:
        dispenserId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        pointId: { type: string, format: uuid }
        active: { type: boolean }
        passwordStatus: { type: string, enum: [pending_setup, setup_link_expired, set] }
        setupLinkExpiresAt: { type: [string, 'null'], format: date-time }
    AuditEvent:
      type: object
      required: [eventId, actorId, actorRole, action, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/StaffRole' }
        actorDisplayName: { type: string }
        action: { type: string, examples: [window.capacity_updated] }
        targetType: { type: string }
        targetId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
        details:
          type: object
          description: Solo claves permitidas; nunca cédulas, diagnósticos ni medicamentos.
          additionalProperties: { type: [string, number, boolean, 'null'] }

    TelegramUpdate:
      type: object
      description: Objeto Update de la API de bots de Telegram. Se valida solo lo que usa el bot.
      required: [update_id]
      properties:
        update_id: { type: integer }
        message: { type: object }
        callback_query: { type: object }
      additionalProperties: true
    DispatchSummary:
      type: object
      required: [processed, skipped, failed]
      properties:
        processed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
