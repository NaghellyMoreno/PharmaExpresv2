openapi: 3.1.0
info:
  title: Pharma Express API
  version: 0.1.0
  summary: Contrato entre la web, los paneles, el bot de Telegram y el backend NestJS.
  description: |
    Fuente de verdad del producto: docs/00-contexto-producto.md (versión 6). Arquitectura: docs/03-arquitectura.md y docs/adr/.

    Reglas generales:
    - Prefijo /api/v1. Mismo origen que la web (reescritura de Vercel, ADR 0002).
    - Errores en formato Problem Details (RFC 9457), esquema Problem.
    - Toda operación que cambia datos con una cookie de sesión (deviceSession o staffSession) exige la cabecera X-CSRF-Token y una cabecera Origin del dominio propio (ADR 0014 y 0016).
    - Denegar por defecto: las operaciones sin seguridad están marcadas explícitamente con `security: []` y son las únicas públicas (ADR 0016).
    - Ninguna notificación, enlace ni registro incluye medicamentos ni diagnósticos. Las respuestas al paciente solo incluyen medicamentos cuando hay vinculación vigente y nunca incluyen diagnósticos.
    - Horas en ISO 8601 con desfase; la zona de negocio es America/Bogota.
    - Los ejemplos usan datos ficticios.
servers:
  - url: /api/v1
tags:
  - name: Público
  - name: Identidad y consentimiento
  - name: Canal del paciente
  - name: Solicitudes y documentos
  - name: Agenda
  - name: Revocación
  - name: Telegram
  - name: Tareas internas
  - name: Personal
  - name: Dispensador
  - name: Administración

paths:
  /health:
    get:
      tags: [Público]
      operationId: getHealth
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /privacy-notice:
    get:
      tags: [Público]
      operationId: getPrivacyNotice
      summary: Aviso de privacidad vigente y texto de la opción de revocación
      security: []
      responses:
        '200':
          description: Aviso vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyNotice' }

  /consents/acceptance:
    post:
      tags: [Identidad y consentimiento]
      operationId: acceptPrivacyNotice
      summary: Aceptar el tratamiento de datos (sin registro en base de datos hasta verificar)
      description: |
        Emite la cookie firmada __Host-pe_consent con la versión del aviso, quién acepta (titular o tercero), la fecha y el canal web.
        No crea ningún registro en la base de datos (invariante 3). Si la persona no acepta, la web no llama a la API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAcceptanceInput' }
      responses:
        '204':
          description: Aceptación guardada en la cookie firmada.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Host-pe_consent firmada, HttpOnly, Secure, SameSite=Strict.
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: La versión del aviso no es la vigente.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /identity/otp-requests:
    post:
      tags: [Identidad y consentimiento]
      operationId: requestVerificationCode
      summary: Pedir el código de un solo uso para verificar la identidad
      description: |
        Requiere la cookie de consentimiento. La respuesta es idéntica exista o no la cédula en la EPS simulada (RNF-032).
        Un código nuevo cada 2 minutos como mínimo, máximo 5 por cédula por hora contando los de revocación; cada código nuevo anula el anterior.
      security:
        - consentCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CedulaInput' }
      responses:
        '202':
          description: Mensaje único; el envío ocurre después de responder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /identity/verifications:
    post:
      tags: [Identidad y consentimiento]
      operationId: verifyIdentity
      summary: Verificar la identidad con el código y vincular el navegador
      description: |
        Si el código es correcto, registra el consentimiento ligado a la huella de la cédula, crea el dispositivo del navegador si no existe
        (cookie __Host-pe_device) y vincula el navegador al paciente por 3 meses.
      security:
        - consentCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerificationInput' }
      responses:
        '200':
          description: Identidad verificada y navegador vinculado.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Host-pe_device (si no existía), HttpOnly, Secure, SameSite=Strict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/CodeGone' }
        '422': { $ref: '#/components/responses/WrongCode' }

  /revocations/otp-requests:
    post:
      tags: [Revocación]
      operationId: requestRevocationCode
      summary: Pedir un código nuevo para revocar la autorización
      description: |
        No exige aceptar el aviso de privacidad ni vinculación (sección 3.2). Mismas reglas y mismo mensaje que el código de verificación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CedulaInput' }
      responses:
        '202':
          description: Mensaje único.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /revocations:
    post:
      tags: [Revocación]
      operationId: revokeConsent
      summary: Revocar la autorización y eliminar los datos del paciente
      description: |
        Exige el código de revocación correcto aunque el canal esté vinculado. Elimina documentos, OCR, prevalidaciones, solicitudes, citas,
        vinculaciones y recordatorios; cancela citas activas y libera cupo y medicamentos; conserva solo la prueba del consentimiento y de la
        revocación ligada a la huella de la cédula. No crea vinculación. Envía confirmación por SMS y correo con el número de citas canceladas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerificationInput' }
      responses:
        '200':
          description: Revocación completada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/CodeGone' }
        '422': { $ref: '#/components/responses/WrongCode' }

  /me:
    get:
      tags: [Canal del paciente]
      operationId: getChannelSession
      summary: Vinculaciones vigentes del navegador y token CSRF
      description: Solo devuelve vinculaciones vigentes; las vencidas no muestran información.
      security:
        - deviceSession: []
      responses:
        '200':
          description: Sesión del navegador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/bindings/{patientRefId}:
    delete:
      tags: [Canal del paciente]
      operationId: unlinkPatient
      summary: Desvincular un paciente de este navegador
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Vinculación revocada; las demás siguen vigentes. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/push-subscription:
    put:
      tags: [Canal del paciente]
      operationId: savePushSubscription
      summary: Activar las notificaciones web en este navegador
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '204': { description: Suscripción guardada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Canal del paciente]
      operationId: deletePushSubscription
      summary: Desactivar las notificaciones web en este navegador
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Suscripción eliminada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /patients/{patientRefId}/health-data-authorizations:
    post:
      tags: [Solicitudes y documentos]
      operationId: authorizeHealthData
      summary: Autorizar el tratamiento de datos de salud antes de cargar documentos
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthDataAuthorizationInput' }
      responses:
        '201': { description: Autorización registrada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patients/{patientRefId}/requests:
    get:
      tags: [Solicitudes y documentos]
      operationId: listCareRequests
      summary: Solicitudes del paciente
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
      responses:
        '200':
          description: Lista de solicitudes.
          content:
            application/json:
              schema:
                type: object
                required: [items, openCount, maxOpen]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CareRequestSummary' }
                  openCount: { type: integer, minimum: 0 }
                  maxOpen: { type: integer, const: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Solicitudes y documentos]
      operationId: createCareRequest
      summary: Iniciar una solicitud (máximo 2 abiertas por paciente)
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Solicitud creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /patients/{patientRefId}/requests/{requestId}:
    get:
      tags: [Solicitudes y documentos]
      operationId: getCareRequest
      summary: Detalle de la solicitud con documentos, estado de procesamiento y resultado preliminar
      description: La web consulta este recurso mientras el estado es processing (mensaje "procesando").
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Detalle.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientRefId}/requests/{requestId}/documents/upload-intents:
    post:
      tags: [Solicitudes y documentos]
      operationId: createUploadIntent
      summary: Autorizar la carga de un documento y obtener la URL firmada de subida directa
      description: |
        Comprueba vinculación, autorización de datos de salud, cargas restantes (3 por documento) y el límite de 20 archivos por paciente por hora.
        El archivo se sube directo al almacenamiento privado con la URL devuelta; nunca pasa por la función (sección 3.14).
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentInput' }
      responses:
        '201':
          description: URL firmada emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /patients/{patientRefId}/requests/{requestId}/documents/{documentId}/completion:
    post:
      tags: [Solicitudes y documentos]
      operationId: completeDocumentUpload
      summary: Confirmar la subida; el backend valida el contenido real, limpia metadatos y lanza el OCR
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Documento aceptado para procesar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /patients/{patientRefId}/requests/{requestId}/prevalidation:
    post:
      tags: [Solicitudes y documentos]
      operationId: startPrevalidation
      summary: Iniciar la prevalidación de la solicitud
      description: Resultado en máximo 60 segundos por solicitud; se consulta con getCareRequest. Todo resultado es preliminar.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Prevalidación en curso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /patients/{patientRefId}/requests/{requestId}/formulas/{formulaId}/availability-checks:
    post:
      tags: [Agenda]
      operationId: checkAvailability
      summary: Consultar puntos y ventanas permitidas para una fórmula apta
      description: |
        No aparta cupo ni existencias (P6). Si no hay existencias en ningún punto o no hay cupo en los días permitidos, responde
        no_availability, programa un único recordatorio a las 48 horas y no crea pendientes.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/FormulaId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Opciones actuales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /patients/{patientRefId}/requests/{requestId}/formulas/{formulaId}/confirmations:
    post:
      tags: [Agenda]
      operationId: confirmFormulaAppointments
      summary: Confirmar las citas de una fórmula (todo o nada)
      description: |
        Reserva en una transacción el cupo y los medicamentos de todas las citas de la fórmula. Si otra persona tomó el cupo o las existencias,
        no se reserva ninguna y la respuesta 409 trae las opciones actualizadas.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/FormulaId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmationInput' }
      responses:
        '201':
          description: Citas confirmadas.
          content:
            application/json:
              schema:
                type: object
                required: [appointments]
                properties:
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/AppointmentSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cupo o existencias tomados por otra persona; ninguna cita de la fórmula quedó reservada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReservationConflictProblem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /patients/{patientRefId}/appointments:
    get:
      tags: [Agenda]
      operationId: listAppointments
      summary: Citas del paciente
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
      responses:
        '200':
          description: Citas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AppointmentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patients/{patientRefId}/appointments/{appointmentId}:
    get:
      tags: [Agenda]
      operationId: getAppointment
      summary: Detalle de la cita con el código de entrega numérico (la web dibuja el QR)
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Cita.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientAppointmentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientRefId}/appointments/{appointmentId}/cancellation:
    post:
      tags: [Agenda]
      operationId: cancelAppointment
      summary: Cancelar una cita (sin reprogramación)
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PatientRefId'
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Cita cancelada; cupo y existencias liberados; lo no recogido de fórmulas con entrega parcial se pierde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /telegram/webhook:
    post:
      tags: [Telegram]
      operationId: receiveTelegramUpdate
      summary: Webhook del bot de Telegram
      description: |
        Recibe actualizaciones de Telegram (https://core.telegram.org/bots/api#update). Sin la cabecera secreta correcta responde 401 sin efectos.
        Con el secreto correcto responde 200 aunque el caso de uso falle (el error se informa en el chat). El bot usa en proceso los mismos casos
        de uso de la web (recorrido completo: aviso, verificación, vinculación, carga, prevalidación, agenda, consulta, cancelación, revocación,
        desvinculación). Responde o muestra "procesando" en máximo 3 segundos; el trabajo largo sigue en segundo plano.
      security:
        - telegramSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramUpdate' }
      responses:
        '200': { description: Actualización recibida. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/jobs/dispatch:
    get:
      tags: [Tareas internas]
      operationId: dispatchJobsFromCron
      summary: Despachar tareas vencidas (invocación de Vercel Cron)
      description: Vercel Cron invoca con GET y Authorization Bearer CRON_SECRET. Idempotente.
      security:
        - jobBearer: []
      responses:
        '200':
          description: Resumen del despacho.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tareas internas]
      operationId: dispatchJobs
      summary: Despachar tareas vencidas (disparador preciso, ADR 0011)
      security:
        - jobBearer: []
        - schedulerSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  format: uuid
                  description: Tarea concreta que despertó el mensaje; si se omite, se despachan todas las vencidas.
      responses:
        '200':
          description: Resumen del despacho.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff/sessions:
    post:
      tags: [Personal]
      operationId: createStaffSession
      summary: Iniciar sesión en el panel del dispensador o de administración
      description: Mensaje de error genérico para cuenta inexistente, contraseña errada, cuenta desactivada o bloqueada (5 errores bloquean 15 minutos).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginInput' }
      responses:
        '201':
          description: Sesión creada.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Host-pe_staff, HttpOnly, Secure, SameSite=Strict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/sessions/current:
    get:
      tags: [Personal]
      operationId: getCurrentStaffSession
      summary: Sesión actual y token CSRF
      security:
        - staffSession: []
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Personal]
      operationId: deleteCurrentStaffSession
      summary: Cerrar sesión
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Sesión cerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff/password-resets:
    post:
      tags: [Personal]
      operationId: requestPasswordReset
      summary: Pedir el enlace de recuperación de contraseña
      description: |
        Respuesta idéntica exista o no la cuenta. Enlace de un solo uso que vence en 30 minutos; máximo 3 solicitudes por hora.
        Conteo por correo y comportamiento al superar el límite o con cuenta desactivada: propuesta del ADR 0019 (P37 y P39).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254, examples: [dispensador.prueba@example.com] }
      responses:
        '202':
          description: Mensaje único.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /staff/password-changes:
    post:
      tags: [Personal]
      operationId: setPasswordWithToken
      summary: Definir o restablecer la contraseña con un enlace de un solo uso
      description: |
        Sirve para el enlace de definición (48 horas) y el de recuperación (30 minutos). No inicia sesión, cierra todas las sesiones
        de la cuenta y avisa por correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeInput' }
      responses:
        '204': { description: Contraseña guardada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/LinkGone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /dispenser/appointments:
    get:
      tags: [Dispensador]
      operationId: listPointAppointments
      summary: Citas del día en el punto del dispensador
      security:
        - staffSession: []
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Fecha de servicio en America/Bogota; por defecto, hoy.
      responses:
        '200':
          description: Citas del punto.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DispenserAppointmentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dispenser/code-validations:
    post:
      tags: [Dispensador]
      operationId: validateDeliveryCode
      summary: Validar el código de entrega (QR o numérico) y registrar la llegada
      description: Válido solo en el punto del dispensador, dentro de la ventana y una sola vez.
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[0-9]{4,12}$', examples: ['48213907'] }
      responses:
        '200':
          description: Código válido; llegada registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispenserAppointmentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El código pertenece a otro punto (other_point) o el rol no es dispensador.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Código ya usado (code_used), de cita cancelada o expirada (code_invalid) o fuera de la ventana (outside_window).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

